spring:
  application:
    name: calorieNormalizer
  datasource:
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
    url: jdbc:postgresql://localhost:5432/weightless
    jpa:
      hibernate:
        ddl-auto: update
      show_sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
  logging:
    level:
      org:
        hibernate:
          orm:
            jdbc:
              bind: TRACE
server:
  port: 8081